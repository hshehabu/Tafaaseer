name: tafaseer
description: "Quran reader with offline tafsir on long-press: al-Muyassar, al-Sa'di, al-Baghawi, Ibn Kathir, al-Qurtubi, al-Tabari."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    # Built by ../pipeline (see README.md). Not committed: run the pipeline first.
    - assets/db/
    # Optional: drop the KFGQPC Hafs font here as UthmanicHafs.ttf (loaded at runtime).
    - assets/fonts/
